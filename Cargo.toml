[workspace]
resolver = "2"
members = ["crates/krypton-crypto", "crates/krypton-zk", "crates/krypton-pow", "crates/krypton-core", "crates/krypton-store", "crates/krypton-light", "crates/krypton-wallet-core", "crates/krypton-p2p", "apps/kryptond", "apps/krypton-miner", "apps/krypton-wallet-cli", "apps/krypton-wallet", "crates/krypton-sdk", "apps/krypton-setup", "apps/krypton-release", "crates/krypton-swap"]

[workspace.package]
version = "1.0.25"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/genoryn/genoryn"
authors = ["Zarazi Sokani"]

[workspace.dependencies]
krypton-crypto = { path = "crates/krypton-crypto" }
krypton-zk = { path = "crates/krypton-zk" }
krypton-pow = { path = "crates/krypton-pow" }
krypton-core = { path = "crates/krypton-core" }
krypton-store = { path = "crates/krypton-store" }
krypton-p2p = { path = "crates/krypton-p2p" }
krypton-light = { path = "crates/krypton-light", default-features = false }
krypton-wallet-core = { path = "crates/krypton-wallet-core" }
krypton-sdk = { path = "crates/krypton-sdk" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
sha2 = "0.10"
blake3 = "1.8"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
fips203 = "0.4"
fips204 = "0.4"
fips205 = "0.4"
winterfell = "0.13"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redb = "2.6"
parking_lot = "0.12"
rayon = "1.10"
num_cpus = "1.16"
bip39 = { version = "2.2", features = ["rand", "zeroize"] }
futures = "0.3"
proptest = "1.6"
tempfile = "3.20"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Untrusted proofs can make the STARK verifier panic; nodes catch that and reject.
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
