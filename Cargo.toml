[workspace]
members = ["crates/genoryn-core", "crates/genoryn-wallet-core", "crates/genoryn-connect", "apps/genoryn", "apps/genoryn-wallet"]
resolver = "2"
exclude = ["third-party/randomx-rs"]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/genoryn/genoryn"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
orchard = "=0.16.0"
rand = "0.10"
rand08 = { package = "rand", version = "0.8" }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
nonempty = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
tokio = { version = "1.48", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
tokio-socks = "0.5"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
randomx-rs = { path = "third-party/randomx-rs" }
saturating-time = { path = "third-party/saturating-time" }
