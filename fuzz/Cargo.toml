[package]
name = "genoryn-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
genoryn-core = { path = "../crates/genoryn-core" }
genoryn-wallet-core = { path = "../crates/genoryn-wallet-core" }
serde_json = "1.0"

[workspace]
members = ["."]

[patch.crates-io]
randomx-rs = { path = "../third-party/randomx-rs" }

[[bin]]
name = "block_parser"
path = "fuzz_targets/block_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_parser"
path = "fuzz_targets/transaction_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "username_parser"
path = "fuzz_targets/username_parser.rs"
test = false
doc = false
bench = false
