# Genoryn Krypton (GNR) miner for Hive OS. This file is read by Hive OS, not by the miner.
CUSTOM_NAME=genoryn
# Replaced with the release version when the package is built.
CUSTOM_VERSION=0.0.0
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/genoryn/genoryn.conf
CUSTOM_LOG_BASENAME=/var/log/miner/custom/genoryn
# Default node when the Flight Sheet leaves the pool URL empty.
CUSTOM_DEFAULT_NODE=https://genoryn.io
