[package]
name = "krypton-light"
description = "Light client protocol for Genoryn Krypton: no full node needed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
krypton-crypto.workspace = true
krypton-core.workspace = true
krypton-pow.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"], optional = true }

[features]
default = ["client"]
client = ["dep:reqwest"]
