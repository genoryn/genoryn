name: Idea or improvement
description: Suggest a change to the wallet, the protocol, the documentation or the website.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you propose?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Alternatives you considered, risks, links.
