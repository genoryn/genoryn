name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A fixed toolchain: every new stable brings new lints, and those must not turn an
      # unrelated commit red. Raise the version deliberately, together with any fixes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release -p krypton-zk
  hiveos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The package's scripts in Ubuntu 20.04, the oldest base Hive OS uses.
      - run: bash integrations/hiveos/tests/run.sh
  audit:
    runs-on: ubuntu-latest
    # The audit action reports its result as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
