name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A fixed toolchain: every new stable brings new lints, and those must not turn an
      # unrelated commit red. Raise the version deliberately, together with any fixes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release -p krypton-zk
      # Fork choice over a partition longer than a thousand blocks (mines thousands).
      - run: cargo test --release -p krypton-store -- --ignored
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The English catalogs must match the pages, the wallet's built catalogs its sources.
      - run: python website/build.py
      - run: python website/i18n.py extract && git diff --exit-code -- website/locales/en
      - run: python website/i18n_wallet.py extract && python website/i18n_wallet.py build && git diff --exit-code -- apps/krypton-wallet/locales
      # Translations: no error in any language, and every localized page and link exists.
      - run: python website/i18n_check.py --dist
      - run: python website/i18n_check.py --wallet
  hiveos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The package's scripts in Ubuntu 20.04, the oldest base Hive OS uses.
      - run: bash integrations/hiveos/tests/run.sh
  audit:
    runs-on: ubuntu-latest
    # The audit action reports its result as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
